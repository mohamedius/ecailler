<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L'Écailler | Gestion Dynamique</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @media print { .no-print { display: none; } }
        .active-tab { background-color: #f97316; color: white !important; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="bg-slate-50 flex h-screen overflow-hidden font-sans">

    <aside class="w-72 bg-white border-r border-slate-200 flex flex-col no-print overflow-y-auto">
        <div class="p-8 text-center border-b border-slate-100">
            <img src="logo_ecailler.jpg" alt="Logo" class="mx-auto h-20 mb-2">
            <h1 class="text-lg font-bold text-slate-800">L'ÉCAILLER</h1>
        </div>

        <nav class="flex-1 px-4 py-6 space-y-2">
            <button onclick="switchTab('pos')" id="nav-pos" class="nav-btn active-tab flex items-center w-full px-4 py-3 rounded-xl transition-all">
                <i class="fa-solid fa-cash-register w-6"></i><span class="ml-3 font-semibold">POS</span>
            </button>
            <button onclick="switchTab('commandes')" id="nav-commandes" class="nav-btn flex items-center w-full px-4 py-3 text-slate-600 rounded-xl transition-all hover:bg-orange-50">
                <i class="fa-solid fa-shopping-cart w-6"></i><span class="ml-3 font-semibold">Commandes</span>
            </button>
            <button onclick="switchTab('clients')" id="nav-clients" class="nav-btn flex items-center w-full px-4 py-3 text-slate-600 rounded-xl transition-all hover:bg-orange-50">
                <i class="fa-solid fa-users w-6"></i><span class="ml-3 font-semibold">Clients</span>
            </button>
            <button onclick="switchTab('depenses')" id="nav-depenses" class="nav-btn flex items-center w-full px-4 py-3 text-slate-600 rounded-xl transition-all hover:bg-orange-50">
                <i class="fa-solid fa-wallet w-6"></i><span class="ml-3 font-semibold">Dépenses</span>
            </button>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">
        <header class="h-16 bg-white border-b border-slate-100 flex items-center justify-between px-10">
            <h2 id="header-title" class="font-black text-slate-800 uppercase tracking-widest">Point de Vente</h2>
            <div id="live-clock" class="text-slate-400 font-mono font-bold"></div>
        </header>

        <div class="flex-1 overflow-y-auto p-8">
            
            <div id="tab-pos" class="tab-content active">
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div class="lg:col-span-2 space-y-6">
                        <div class="bg-slate-900 rounded-[2.5rem] p-10 text-white text-center shadow-2xl">
                            <div class="text-7xl font-mono font-black text-orange-500 mb-4"><span id="poids-num">0.000</span> <small class="text-2xl">KG</small></div>
                            <div class="flex justify-center space-x-4">
                                <button onclick="addW(0.1)" class="bg-slate-800 px-6 py-3 rounded-xl font-bold">+100g</button>
                                <button onclick="addW(1)" class="bg-slate-800 px-6 py-3 rounded-xl font-bold">+1kg</button>
                                <button onclick="resetW()" class="bg-red-600 px-6 py-3 rounded-xl font-bold">RAZ</button>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <button onclick="setProd('Capitaine', 7500)" class="bg-white p-6 rounded-2xl border-2 border-transparent hover:border-orange-500 shadow-sm text-left">
                                <h4 class="font-black">Capitaine Frais</h4><p class="text-orange-500">7.500 F/kg</p>
                            </button>
                            <button onclick="setProd('Mérou', 9500)" class="bg-white p-6 rounded-2xl border-2 border-transparent hover:border-orange-500 shadow-sm text-left">
                                <h4 class="font-black">Mérou Rouge</h4><p class="text-orange-500">9.500 F/kg</p>
                            </button>
                        </div>
                    </div>
                    <div class="bg-white p-8 rounded-[2rem] shadow-lg flex flex-col justify-between border border-slate-100">
                        <div>
                            <h3 class="font-black mb-6 border-b pb-4">Panier Actuel</h3>
                            <div class="space-y-4">
                                <div class="flex justify-between"><span>Produit:</span><span id="cart-item" class="font-bold">-</span></div>
                                <div class="flex justify-between"><span>Poids:</span><span id="cart-kg" class="font-bold">0.000 kg</span></div>
                            </div>
                        </div>
                        <div class="mt-8">
                            <div class="flex justify-between items-end mb-6"><span>TOTAL</span><span id="cart-total" class="text-3xl font-black">0 F</span></div>
                            <button onclick="saveAndPrint()" class="w-full bg-orange-500 text-white py-5 rounded-2xl font-black shadow-lg hover:bg-orange-600">ENCAISSER</button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="tab-clients" class="tab-content">
                <div class="max-w-2xl bg-white p-8 rounded-3xl shadow-sm border">
                    <h3 class="text-xl font-black mb-6">Nouveau Client</h3>
                    <div class="space-y-4 mb-8">
                        <input id="c-name" type="text" placeholder="Nom Complet" class="w-full p-4 bg-slate-50 rounded-xl border-none">
                        <input id="c-phone" type="text" placeholder="Téléphone" class="w-full p-4 bg-slate-50 rounded-xl border-none">
                        <button onclick="addClient()" class="bg-slate-800 text-white px-8 py-4 rounded-xl font-bold">Enregistrer le Client</button>
                    </div>
                    <h4 class="font-bold mb-4">Liste des Clients</h4>
                    <ul id="client-list" class="divide-y"></ul>
                </div>
            </div>

            <div id="tab-commandes" class="tab-content">
                <div class="bg-white rounded-3xl p-8 shadow-sm border">
                    <h3 class="text-xl font-black mb-6">Historique des Ventes</h3>
                    <table class="w-full text-left">
                        <thead><tr class="text-slate-400 text-sm"><th>Date</th><th>Produit</th><th>Poids</th><th>Total</th></tr></thead>
                        <tbody id="sales-history" class="text-slate-700"></tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <script>
        let weight = 0, price = 0, item = "";
        let clients = JSON.parse(localStorage.getItem('clients')) || [];
        let sales = JSON.parse(localStorage.getItem('sales')) || [];

        // NAVIGATION LOGIC
        function switchTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active-tab'));
            document.getElementById('tab-' + id).classList.add('active');
            document.getElementById('nav-' + id).classList.add('active-tab');
            if(id === 'clients') renderClients();
            if(id === 'commandes') renderSales();
        }

        // POS LOGIC
        function addW(v) { weight += v; update(); }
        function resetW() { weight = 0; update(); }
        function setProd(n, p) { item = n; price = p; update(); }
        function update() {
            document.getElementById('poids-num').innerText = weight.toFixed(3);
            document.getElementById('cart-kg').innerText = weight.toFixed(3) + " kg";
            document.getElementById('cart-item').innerText = item || "-";
            document.getElementById('cart-total').innerText = (weight * price).toLocaleString() + " F";
        }

        function saveAndPrint() {
            if(weight <= 0 || !item) return alert("Choisissez un produit et son poids.");
            let sale = { date: new Date().toLocaleString(), item, weight: weight.toFixed(3), total: (weight * price) };
            sales.push(sale);
            localStorage.setItem('sales', JSON.stringify(sales));
            alert("Vente enregistrée !");
            resetW();
        }

        // CLIENT LOGIC
        function addClient() {
            let n = document.getElementById('c-name').value, p = document.getElementById('c-phone').value;
            if(!n || !p) return alert("Remplir tous les champs");
            clients.push({n, p});
            localStorage.setItem('clients', JSON.stringify(clients));
            document.getElementById('c-name').value = ''; document.getElementById('c-phone').value = '';
            renderClients();
        }
        function renderClients() {
            document.getElementById('client-list').innerHTML = clients.map(c => `<li class="py-3 font-medium">${c.n} - ${c.p}</li>`).join('');
        }
        function renderSales() {
            document.getElementById('sales-history').innerHTML = sales.map(s => `<tr class="border-b h-12"><td>${s.date}</td><td>${s.item}</td><td>${s.weight} kg</td><td class="font-bold">${s.total} F</td></tr>`).join('');
        }

        setInterval(() => { document.getElementById('live-clock').innerText = new Date().toLocaleTimeString('fr-FR'); }, 1000);
    </script>
</body>
</html>
